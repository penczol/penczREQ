name: Approved release

on:
  release:
    types:
      - published

permissions:
  actions: read
  contents: read

concurrency:
  group: approved-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify trusted source and build release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a final release from trusted main history
        run: |
          test "${GITHUB_EVENT_RELEASE_PRERELEASE}" = false
          test "$(git rev-parse "${GITHUB_EVENT_RELEASE_TAG_NAME}^{commit}")" = "${GITHUB_SHA}"
          git show-ref --verify refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
        env:
          GITHUB_EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate release identity and license decision
        run: |
          version="$(python -c "from request_app import __version__; print(__version__)")"
          test "${GITHUB_EVENT_RELEASE_TAG_NAME}" = "v${version}"
          test -f LICENSE
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Install locked test and audit environment
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --requirement requirements-ci.lock
          python -m pip check
      - name: Run tests and source gates
        run: |
          mkdir -p dist
          python -m pytest -q
          python -m compileall -q request_app tools tests
          find request_app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n deploy/truenas/install.sh tools/container-smoke.sh tools/inspect-image.sh
          python tools/publication_gate.py --require-license --json-output dist/publication-gate.json
          python -m pip_audit --requirement requirements.lock --format json --output dist/pip-audit.json --strict
          python -m detect_secrets scan --no-verify $(git ls-files) > dist/detect-secrets.json
          python -c "import json,sys; data=json.load(open('dist/detect-secrets.json',encoding='utf-8')); sys.exit(1 if data.get('results') else 0)"
      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: dist/trivy-source.json
          exit-code: "1"
      - name: Build and smoke-test the release image
        run: |
          version="$(python -c "from request_app import __version__; print(__version__)")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/penczreq:${version}"
          docker build \
            --build-arg APP_VERSION="${version}" \
            --build-arg BUILD_DATE="${GITHUB_EVENT_RELEASE_PUBLISHED_AT}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg VCS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${image}" \
            --tag penczreq:release .
          bash tools/inspect-image.sh "${image}"
          bash tools/container-smoke.sh "${image}"
        env:
          GITHUB_EVENT_RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
      - name: Generate release assets and SPDX SBOM
        run: python tools/build_release_artifacts.py --output-dir dist
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: penczreq:release
          format: spdx-json
          output-file: dist/penczreq-0.5.2.spdx.json
          upload-artifact: false
      - name: Scan release image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: penczreq:release
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: dist/trivy-image.json
          exit-code: "1"
      - name: Seal the verified image and evidence
        run: |
          version="$(python -c "from request_app import __version__; print(__version__)")"
          image_filename="penczreq-${version}-docker-amd64.tar"
          image_archive="dist/${image_filename}"
          docker save --output "${image_archive}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/penczreq:${version}"
          tar -tf "${image_archive}" manifest.json >/dev/null
          (cd dist && sha256sum "${image_filename}" > "${image_filename}.sha256")
          sha256sum \
            dist/SHA256SUMS \
            dist/detect-secrets.json \
            dist/penczREQ-${version}-release-notes.md \
            dist/penczreq-installer-${version}.tar.gz \
            dist/penczreq-installer-${version}.tar.gz.sha256 \
            dist/penczreq-${version}.spdx.json \
            "${image_archive}" \
            "${image_archive}.sha256" \
            dist/pip-audit.json \
            dist/publication-gate.json \
            dist/release-manifest.json \
            dist/trivy-image.json \
            dist/trivy-source.json \
            > dist/release-candidate.sha256
      - name: Transfer verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable image, then promote stable
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-candidate
          path: dist
      - name: Verify and load the release candidate
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check dist/release-candidate.sha256
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          image_archive="dist/penczreq-${version}-docker-amd64.tar"
          tar -tf "${image_archive}" manifest.json >/dev/null
          docker load -i "${image_archive}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/penczreq:${version}"
          docker image inspect "${image}" >/dev/null
      - name: Publish immutable image and then stable
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/penczreq:${version}"
          stable="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/penczreq:stable"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}"
          docker image inspect "${image}" --format '{{index .RepoDigests 0}}' > dist/image-digest.txt
          test -s dist/image-digest.txt
          docker tag "${image}" "${stable}"
          docker push "${stable}"
      - name: Attach checksums, installer, reports and SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          assets=(
            dist/SHA256SUMS
            dist/detect-secrets.json
            dist/image-digest.txt
            dist/penczREQ-${version}-release-notes.md
            dist/penczreq-installer-${version}.tar.gz
            dist/penczreq-installer-${version}.tar.gz.sha256
            dist/penczreq-${version}.spdx.json
            dist/penczreq-${version}-docker-amd64.tar
            dist/penczreq-${version}-docker-amd64.tar.sha256
            dist/pip-audit.json
            dist/publication-gate.json
            dist/release-manifest.json
            dist/trivy-image.json
            dist/trivy-source.json
          )
          for asset in "${assets[@]}"; do test -f "${asset}"; done
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" "${assets[@]}" --clobber
