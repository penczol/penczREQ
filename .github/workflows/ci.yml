name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked test environment
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-ci.txt
          python -m pip check
      - name: Run regression suite
        run: python -m pytest -q
      - name: Validate Python, JavaScript and shell sources
        run: |
          python -m compileall -q request_app tools tests
          find request_app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          bash -n deploy/truenas/install.sh tools/container-smoke.sh tools/inspect-image.sh
      - name: Verify deterministic release artifacts
        run: |
          python tools/build_release_artifacts.py --output-dir dist/first --repository "${GITHUB_REPOSITORY}"
          python tools/build_release_artifacts.py --output-dir dist/second --repository "${GITHUB_REPOSITORY}"
          diff --recursive --brief dist/first dist/second

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install audit tools
        run: |
          python -m pip install --requirement requirements-ci.txt
          mkdir -p dist
      - name: Audit Python dependencies
        id: pip_audit
        continue-on-error: true
        run: python -m pip_audit --requirement requirements.txt --format json --output dist/pip-audit.json --strict
      - name: Scan tracked files for secrets
        id: secret_scan
        continue-on-error: true
        run: |
          python -m detect_secrets scan --no-verify $(git ls-files) > dist/detect-secrets.json
          python -c "import json,sys; data=json.load(open('dist/detect-secrets.json',encoding='utf-8')); findings=data.get('results',{}); print('detect-secrets files:', len(findings)); sys.exit(1 if findings else 0)"
      - name: Run publication privacy gate
        id: privacy_gate
        continue-on-error: true
        run: python tools/publication_gate.py --json-output dist/publication-gate.json
      - name: Scan source and lockfiles with Trivy
        id: trivy_source
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: dist/trivy-source.json
          exit-code: "1"
      - name: Scan configuration with Trivy
        id: trivy_config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: dist/trivy-config.json
          exit-code: "1"
      - name: Upload source audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-audit-reports
          path: dist/*.json
          if-no-files-found: error
      - name: Enforce source audit result
        if: always()
        run: |
          test "${{ steps.pip_audit.outcome }}" = success
          test "${{ steps.secret_scan.outcome }}" = success
          test "${{ steps.privacy_gate.outcome }}" = success
          test "${{ steps.trivy_source.outcome }}" = success
          test "${{ steps.trivy_config.outcome }}" = success

  image:
    needs:
      - test
      - source-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local image
        run: |
          version="$(python3 -c 'from request_app import __version__; print(__version__)')"
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          docker build \
            --build-arg APP_VERSION="${version}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg VCS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag penczreq:ci .
      - name: Inspect image and run container smoke
        run: |
          bash tools/inspect-image.sh penczreq:ci
          bash tools/container-smoke.sh penczreq:ci
          mkdir -p dist
          docker image inspect penczreq:ci --format '{{.Id}}' > dist/image-id.txt
          docker history --no-trunc penczreq:ci > dist/image-history.txt
      - name: Retrieve the successful source audit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-audit-reports
          path: ${{ runner.temp }}/source-audit
      - name: Verify audited Python versions in the built image
        run: |
          docker run --rm -i --network none --entrypoint python penczreq:ci -c '
          import json, sys
          from importlib.metadata import version
          packages = json.load(sys.stdin)["dependencies"]
          if not packages:
              sys.exit("Empty dependency audit")
          for package in packages:
              name = package["name"]
              if package["vulns"] or version(name) != package["version"]:
                  sys.exit(f"Image does not match the clean audit for {name}")
          print(f"Verified {len(packages)} audited packages")
          ' < "$RUNNER_TEMP/source-audit/pip-audit.json"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: penczreq:ci
          format: spdx-json
          output-file: dist/penczreq-${{ env.APP_VERSION }}.spdx.json
          upload-artifact: false
      - name: Scan image with Trivy
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: penczreq:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: dist/trivy-image.json
          exit-code: "0"
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: dist/
          if-no-files-found: error
      - name: Enforce reviewed image vulnerability policy
        if: always()
        run: |
          test "${{ steps.trivy_image.outcome }}" = success
          python tools/enforce_image_vulnerability_policy.py --report dist/trivy-image.json --baseline security/trivy-image-baseline.json
