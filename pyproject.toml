[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "penczreq"
version = "0.5.2"
description = "Private, manually operated media request management"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "pywebpush>=2.3,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["request_app*"]

[tool.setuptools.package-data]
request_app = ["templates/*.html", "static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
